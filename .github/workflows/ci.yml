name: CI (modules)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      module:
        description: "Which module to run (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - data_load
          - data_quality_analysis
          - data_research
          - visualization

jobs:
  run-modules:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Модулі, які лежать у папці src/
        module: [data_load, data_quality_analysis, data_research, visualization]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Дивимось чи були зміни у файлах для якогось з модулів у src/
      - name: Detect changed files for module
        id: changes
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: tj-actions/changed-files@v45
        with:
          files: |
            src/${{ matrix.module }}.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run module
        # Запускаємо за умовою: або ручний вибір, або зміни у файлі модуля
        if: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module)) || (github.event_name != 'workflow_dispatch' && steps.changes.outputs.any_changed == 'true') }}
        run: |
          # Створюємо необхідну структуру папок на Runner-і
          mkdir -p data/raw data/processed reports/figures artifacts/${{ matrix.module }}
          
          echo "Виконується: src.${{ matrix.module }}"
          
          # Запуск модуля. Вивід логується прямо в консоль для дебагу, а також у файл
          python -m src.${{ matrix.module }} 2>&1 | tee artifacts/${{ matrix.module }}/ci.log

      - name: Check and Collect results
        id: art
        run: |
          # Копіюємо графіки з reports, якщо вони були створені
          if [ -d "reports/figures" ]; then 
            cp -r reports/figures/* artifacts/${{ matrix.module }}/ 2>/dev/null || true
          fi
          
          # Перевірка чи папка не порожня
          if [ -d "artifacts/${{ matrix.module }}" ] && [ "$(ls -A artifacts/${{ matrix.module }})" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts
        if: ${{ steps.art.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.module }}
          path: artifacts/${{ matrix.module }}/