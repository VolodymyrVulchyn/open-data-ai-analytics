name: CI (modules)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      module:
        description: "Which module to run (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - data_load
          - data_quality_analysis
          - data_research
          - visualization

jobs:
  run-modules:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: [data_load, data_quality_analysis, data_research, visualization]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # дивимось чи були зміни у файлах для якогось з модулів у папці src/
      - name: Detect changed files for module
        id: changes
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: tj-actions/changed-files@v45
        with:
          files: |
            src/${{ matrix.module }}.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run module
        # workflow dispatch запускаємо або все, або вибраний модуль, при пулл-пуш реквесті, запускаємо модуль лише, якщо були зміни в src/
        if: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module)) || (github.event_name != 'workflow_dispatch' && steps.changes.outputs.any_changed == 'true') }}
        run: |
          mkdir -p artifacts/${{ matrix.module }}
          echo "Running src.${{ matrix.module }}"
          # Додаємо src., щоб пайтон знайшов модуль у папці src
          python -m src.${{ matrix.module }} > artifacts/${{ matrix.module }}/ci.log 2>&1

      - name: Check artifacts dir
        id: art
        run: |
          if [ -d "artifacts/${{ matrix.module }}" ] && [ "$(ls -A artifacts/${{ matrix.module }})" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts
        if: ${{ steps.art.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.module }}
          path: artifacts/${{ matrix.module }}